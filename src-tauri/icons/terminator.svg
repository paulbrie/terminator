<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1b26"/>
      <stop offset="100%" style="stop-color:#24283b"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bg)"/>
  <!-- Terminal window chrome dots -->
  <circle cx="100" cy="90" r="16" fill="#f7768e"/>
  <circle cx="152" cy="90" r="16" fill="#e0af68"/>
  <circle cx="204" cy="90" r="16" fill="#9ece6a"/>
  <!-- Terminal prompt > -->
  <text x="100" y="290" font-family="monospace" font-weight="bold" font-size="200" fill="#7aa2f7">&#62;_</text>
  <!-- Cursor blink line -->
  <rect x="340" y="190" width="12" height="100" rx="4" fill="#bb9af7" opacity="0.8"/>
  <!-- Bottom decorative line -->
  <rect x="100" y="360" width="312" height="6" rx="3" fill="#292e42"/>
  <rect x="100" y="390" width="200" height="6" rx="3" fill="#292e42"/>
</svg>
